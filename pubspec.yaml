name: jmcomic
description: "JMComic-Flutter: A comic reader app for learning purposes, based on JMcomic-API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 网络请求
  http: ^1.5.0
  # MD5 摘要（Token 签名 / AES 密钥派生 / 乱序切片数计算）
  crypto: ^3.0.6
  # AES-256-ECB + PKCS7 响应解密
  encrypt: ^5.0.3
  # 状态管理
  provider: ^6.1.2
  # 本地持久化（主题/登录态/设置）
  shared_preferences: ^2.5.3
  # 封面磁盘缓存
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
