name: jmcomic
description: "JMComic-Flutter: A comic reader app for learning purposes, based on JMcomic-API."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 网络请求
  http: ^1.5.0
  # MD5 摘要（Token 签名 / AES 密钥派生 / 乱序切片数计算）
  crypto: ^3.0.6
  # AES-256-ECB + PKCS7 响应解密
  encrypt: ^5.0.3
  # 状态管理
  provider: ^6.1.2
  # 本地持久化（主题/登录态/设置）
  shared_preferences: ^2.5.3
  # 下载目录（本地下载管理）
  path_provider: ^2.1.4
  # 封面磁盘缓存
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# 锁定不依赖 jni 的 path_provider_android 实现，
# 避免 Android 构建引入 NDK/CMake 原生编译链（纯 Kotlin 实现足够）。
dependency_overrides:
  path_provider_android: 2.2.17

flutter:
  uses-material-design: true
