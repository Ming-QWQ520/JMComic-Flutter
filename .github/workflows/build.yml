name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build APKs (release, universal + split per ABI)
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Prepare artifacts
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/JMComic-Flutter-v${VERSION}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "dist/JMComic-Flutter-v${VERSION}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      "dist/JMComic-Flutter-v${VERSION}-x86_64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk             "dist/JMComic-Flutter-v${VERSION}-universal.apk"
          ls -la dist

      - name: Upload APK artifacts (4 APKs, one artifact each, no extra compression)
        uses: actions/upload-artifact@v4
        with:
          name: JMComic-Flutter-universal
          path: dist/JMComic-Flutter-*-universal.apk
          if-no-files-found: error
          # APK 本身已是压缩格式，不再做 zip 压缩（store 模式）
          compression-level: 0

      - name: Upload APK artifact (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: JMComic-Flutter-arm64-v8a
          path: dist/JMComic-Flutter-*-arm64-v8a.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload APK artifact (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: JMComic-Flutter-armeabi-v7a
          path: dist/JMComic-Flutter-*-armeabi-v7a.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload APK artifact (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: JMComic-Flutter-x86_64
          path: dist/JMComic-Flutter-*-x86_64.apk
          if-no-files-found: error
          compression-level: 0

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
