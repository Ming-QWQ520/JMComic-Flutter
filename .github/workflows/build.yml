name: CI

# 仅手动触发：在 Actions 页面点击 "Run workflow" 或通过 API
# workflow_dispatch 触发构建（推送/打标签不再自动编译）。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build APKs (release, universal + split per ABI)
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Prepare artifacts
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/JMComic-Flutter-v${VERSION}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "dist/JMComic-Flutter-v${VERSION}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      "dist/JMComic-Flutter-v${VERSION}-x86_64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk             "dist/JMComic-Flutter-v${VERSION}-universal.apk"
          ls -la dist

      # 产物汇总为单一 artifact：不再每个架构单独显示一个条目。
      # 注意：从 Actions 页面下载 artifact 时 GitHub 会固定打包成 zip（平台行为，
      # 无法关闭）；需要不压缩的原始 APK 请直接到 Release 下载（见下一步）。
      - name: 正在上传产物
        uses: actions/upload-artifact@v4
        with:
          name: JMComic-Flutter-APK
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0

      # rolling release：先删除旧的 latest 发布与标签，让其指向最新提交
      - name: Remove old rolling release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 将 4 个 APK 直接上传到 Release：Release 资产是原始 .apk 文件，
      # 下载即得 APK 本体，不会被压缩成 zip。
      # - push 到 main/master：更新 rolling release（tag=latest）
      # - push v* 标签：发布对应版本的正式 Release
      - name: 正在上传产物
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('JMComic-Flutter {0}', github.ref_name) || 'JMComic-Flutter 最新构建' }}
          body: |
            自动构建产物（直接下载 .apk / .zip 即可，无需解压）：
            - `universal`：通用版，不确定设备架构时选这个
            - `arm64-v8a`：现代手机（2016 年后绝大多数机型）
            - `armeabi-v7a`：老旧 32 位手机
            - `x86_64`：模拟器 / Chromebook
            - `windows-x64`：Windows 桌面版（解压后运行 jmcomic.exe）
          files: dist/*.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------
  # Windows 桌面版构建：打包为 zip 后上传 artifact，并在 Android 任务
  # 完成后追加到同一个 Release（下载即得，无需解压两步）。
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Pack portable zip
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+?)\+' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          $out = "dist/JMComic-Flutter-v$version-windows-x64.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $out -Force
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JMComic-Flutter-Windows
          path: dist/*.zip
          if-no-files-found: error

      # 追加到 Android 任务刚发布/更新的 Release；无 Release 时（异常情况）
      # 不阻塞，产物仍可从 Actions artifact 下载。
      - name: Attach to release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG=$(case "$GITHUB_REF" in refs/tags/v*) echo "$GITHUB_REF_NAME" ;; *) echo "latest" ;; esac)
          gh release upload "$TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY" \
            || echo "::warning::Release $TAG 不存在或上传失败，Windows 产物仅保留在 Actions artifact"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
