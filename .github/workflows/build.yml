name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build APKs (release, universal + split per ABI)
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Prepare artifacts
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/JMComic-Flutter-v${VERSION}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "dist/JMComic-Flutter-v${VERSION}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      "dist/JMComic-Flutter-v${VERSION}-x86_64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk             "dist/JMComic-Flutter-v${VERSION}-universal.apk"
          ls -la dist

      # 产物汇总为单一 artifact：不再每个架构单独显示一个条目。
      # 注意：从 Actions 页面下载 artifact 时 GitHub 会固定打包成 zip（平台行为，
      # 无法关闭）；需要不压缩的原始 APK 请直接到 Release 下载（见下一步）。
      - name: 正在上传产物
        uses: actions/upload-artifact@v4
        with:
          name: JMComic-Flutter-APK
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0

      # rolling release：先删除旧的 latest 发布与标签，让其指向最新提交
      - name: Remove old rolling release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 将 4 个 APK 直接上传到 Release：Release 资产是原始 .apk 文件，
      # 下载即得 APK 本体，不会被压缩成 zip。
      # - push 到 main/master：更新 rolling release（tag=latest）
      # - push v* 标签：发布对应版本的正式 Release
      - name: 正在上传产物
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('JMComic-Flutter {0}', github.ref_name) || 'JMComic-Flutter 最新构建' }}
          body: |
            自动构建产物（直接下载 .apk 即可，无需解压）：
            - `universal`：通用版，不确定设备架构时选这个
            - `arm64-v8a`：现代手机（2016 年后绝大多数机型）
            - `armeabi-v7a`：老旧 32 位手机
            - `x86_64`：模拟器 / Chromebook
          files: dist/*.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
