name: Windows Build (Windows x64)

# Windows 桌面版构建（自 build.yml 拆分）。
#
# 触发方式：
# 1. Android 构建（build-android.yml）成功后自动链式触发
#    （workflow_run 避免两个工作流同时重建 rolling release 的竞争）；
# 2. 在 Actions 页面手动触发（workflow_dispatch）。
#
# 注意：本工作流会把 windows zip 附加到 rolling release（tag=latest）。
# Android 的 build-android.yml 末尾会删除并重建 latest release——因此
# 本工作流只在 Android 构建完成之后才运行。
on:
  workflow_run:
    workflows: ["Android Build (Android APK)"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    # workflow_run 触发时仅在上游 Android 构建成功且来源为 main/master 时运行
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == 'master'))
    name: Build Windows (x64)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Pack portable zip
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+?)\+' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          $out = "dist/JMComic-Flutter-v$version-windows-x64.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $out -Force
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JMComic-Flutter-Windows
          path: dist/*.zip
          if-no-files-found: error

      # 附加到 rolling release（tag=latest）或版本标签对应的 Release。
      # Release 尚不存在时自动创建；异常失败不阻塞，产物仍可从
      # Actions artifact 下载。
      - name: Attach to release
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.head_branch == 'main' ||
          github.event.workflow_run.head_branch == 'master'
        shell: bash
        run: |
          TAG=$(case "$GITHUB_REF" in refs/tags/v*) echo "$GITHUB_REF_NAME" ;; *) echo "latest" ;; esac)
          gh release upload "$TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY" \
            || gh release create "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" \
                 --title "JMComic-Flutter Windows 构建" --generate-notes \
            || echo "::warning::Release $TAG 上传失败，Windows 产物仅保留在 Actions artifact"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
