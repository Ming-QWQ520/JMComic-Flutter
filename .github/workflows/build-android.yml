name: Android Build (Android APK)

# 触发方式：
# 1. push 到 main/master 分支自动编译（推送即触发）；
# 2. 推送 v* 标签发布正式 Release；
# 3. 在 Actions 页面点击 "Run workflow" 手动触发。
# Windows 桌面版构建已拆分至 build-windows.yml，可独立触发。
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 发布签名：签名材料全部存于仓库 Secrets（JM_KEYSTORE_B64 /
      # JM_STORE_PASSWORD / JM_KEY_ALIAS / JM_KEY_PASSWORD），构建前
      # 解码生成 android/app/jmcomic-release.keystore + android/key.properties，
      # 让 release 构建用用户 keystore 签名（修复覆盖安装签名不一致）。
      # Secrets 未配置时回退 debug 签名（本地开发兼容行为），构建仍会成功。
      - name: Prepare release signing
        env:
          JM_KEYSTORE_B64: ${{ secrets.JM_KEYSTORE_B64 }}
          JM_STORE_PASSWORD: ${{ secrets.JM_STORE_PASSWORD }}
          JM_KEY_ALIAS: ${{ secrets.JM_KEY_ALIAS }}
          JM_KEY_PASSWORD: ${{ secrets.JM_KEY_PASSWORD }}
        run: |
          if [ -n "$JM_KEYSTORE_B64" ] && [ -n "$JM_STORE_PASSWORD" ] && [ -n "$JM_KEY_PASSWORD" ]; then
            echo "$JM_KEYSTORE_B64" | base64 -d > android/app/jmcomic-release.keystore
            cat > android/key.properties <<EOF
          storeFile=jmcomic-release.keystore
          storePassword=${JM_STORE_PASSWORD}
          keyAlias=${JM_KEY_ALIAS}
          keyPassword=${JM_KEY_PASSWORD}
          EOF
            echo "SIGNING=release" >> "$GITHUB_ENV"
            echo "签名模式：release keystore"
          else
            echo "SIGNING=debug" >> "$GITHUB_ENV"
            echo "::warning::未配置签名 Secrets（JM_KEYSTORE_B64/JM_STORE_PASSWORD/JM_KEY_PASSWORD），本次 APK 回退 debug 签名，无法覆盖安装同包名的已发布版本"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build APKs (release, universal + split per ABI)
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      # 签名校验：release 模式下用 apksigner 确认证书指纹与预期一致
      # （防 Secrets 内容/别名填错导致发布出错误签名的包）。
      # 指纹来自本地 keytool -list -v 对 jmcomic-release.keystore 的输出
      # （SHA256 去冒号小写：27:7F:DC:...:8A:60）。
      - name: Verify release signature
        if: env.SIGNING == 'release'
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort | tail -1)
          EXPECTED="277fdc7ad7eb2d365b10410286bddfd315588598bf6b1f7fe19c19e5e2998a60"
          ACTUAL=$($APKSIGNER verify --print-certs build/app/outputs/flutter-apk/app-release.apk \
            | grep -oP 'certificate SHA-256 digest: \K[0-9a-f]+' | head -1)
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK 签名证书与预期 keystore 不一致，请检查 JM_KEYSTORE_B64 / JM_STORE_PASSWORD / JM_KEY_ALIAS Secrets"
            exit 1
          fi
          echo "✓ APK 已用 jmcomic-release.keystore 签名（证书指纹匹配）"

      - name: Prepare artifacts
        id: prep
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/JMComic-Flutter-v${VERSION}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "dist/JMComic-Flutter-v${VERSION}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      "dist/JMComic-Flutter-v${VERSION}-x86_64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk             "dist/JMComic-Flutter-v${VERSION}-universal.apk"
          ls -la dist

      # 各架构 APK 分别作为独立 artifact 上传（不再合并成一个 zip 包）。
      # 注：从 Actions 页面下载 artifact 时 GitHub 平台会固定打包成 zip，
      # 但每个条目内只包含对应架构的单个 APK；需要原始 APK 文件请到
      # Release 下载（见下一步，Release 资产为未压缩的 .apk 本体）。
      - name: Upload artifact (universal)
        uses: actions/upload-artifact@v4
        with:
          name: JMComic-Flutter-v${{ steps.prep.outputs.version }}-universal
          path: dist/JMComic-Flutter-v${{ steps.prep.outputs.version }}-universal.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload artifact (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: JMComic-Flutter-v${{ steps.prep.outputs.version }}-arm64-v8a
          path: dist/JMComic-Flutter-v${{ steps.prep.outputs.version }}-arm64-v8a.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload artifact (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: JMComic-Flutter-v${{ steps.prep.outputs.version }}-armeabi-v7a
          path: dist/JMComic-Flutter-v${{ steps.prep.outputs.version }}-armeabi-v7a.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload artifact (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: JMComic-Flutter-v${{ steps.prep.outputs.version }}-x86_64
          path: dist/JMComic-Flutter-v${{ steps.prep.outputs.version }}-x86_64.apk
          if-no-files-found: error
          compression-level: 0

      # rolling release：先删除旧的 latest 发布与标签，让其指向最新提交。
      # Windows 产物由 build-windows.yml 独立追加（请在本工作流完成后再
      # 触发，避免 rolling release 重建时丢失刚附加的 Windows zip）。
      - name: Remove old rolling release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 将 4 个 APK 以原始文件形式上传到 Release（非 zip，下载即得）：
      # - push 到 main/master：更新 rolling release（tag=latest）
      # - push v* 标签：发布对应版本的正式 Release
      - name: Upload to release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('JMComic-Flutter {0}', github.ref_name) || 'JMComic-Flutter 最新构建' }}
          body: |
            自动构建产物（直接下载 .apk / .zip 即可，无需解压）：
            - `universal`：通用版，不确定设备架构时选这个
            - `arm64-v8a`：现代手机（2016 年后绝大多数机型）
            - `armeabi-v7a`：老旧 32 位手机
            - `x86_64`：模拟器 / Chromebook
            - `windows-x64`：Windows 桌面版（解压后运行 jmcomic.exe）
          files: dist/*.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
